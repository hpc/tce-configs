#!/bin/bash

# This sets the defaults for the process.sh script.  
# See ./bin/process.sh --help for info on what environment variables are available for each option.

# The binary cache signing key
TCE_SECRET=/opt/cert_store/secring.gpg
# The binary cache public key
TCE_PUBLIC_KEY=/opt/cert_store/pubring.gpg

# Spack download URL. Note that this fork of Spack is what we use for deployment
TCE_SPACK_URL=https://github.com/lanl-preteam/spack.git
TCE_SPACK_CHECKOUT=tce_develop

# Force all written files to have this group.
TCE_SHARED_GROUP=hpcsoft

# You can also add site-specific setup here, such as loading/unloading modules, etc.
