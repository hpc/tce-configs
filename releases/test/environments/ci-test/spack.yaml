spack:
  definitions:
    - base-compiler:
      - 'gcc@10.2.0 ^binutils+ld+gold~nls+gas'

    - base:
      - cmake
      # - htop #DEBUG dependency mesa18 fails to build

    - base_matrix:
        - matrix:
          - [$base]

    - install:
      - $base_matrix

  specs:
    - $install

  packages:
    binutils:
      version: ['2.36.1']
      variants: +ld+gold+libiberty~nls+gas
      buildable: true
    gcc:
      version: ['10.2.0']
      variants: +binutils+cxa_atexit+piclibs+strip+nvptx+profiledbootstrap-lean languages=c,c++,fortran,lto
      compiler: [gcc@4.8.5]
      buildable: true
      target: [haswell]
