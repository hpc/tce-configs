      modules: {}
      providers: {}
    # Use the system pkg-config so that system paths aren't returned in calls to `pkg-config`
    pkg-config:
      paths:
        pkg-config@0.29.2%gcc: /usr
      buildable: false
      version: []
      target: []
      compiler: []
      modules: {}
      providers: {}
    python:
      variants: ~uuid
      paths: {}
      buildable: true
      version: []
      target: []
      compiler: []
      modules: {}
      providers: {}
    qt:
      # The version of qt above requires openssl 1.1.1+, which this system doesn't
      # provide. Turn off ssl support.
      variants: ~ssl
      paths: {}
      buildable: true
      version: []
      target: []
      compiler: []
      modules: {}
      providers: {}
    slurm:
      paths:
        slurm@21.08.6a%gcc@10.3.0: /usr
      buildable: false
      version: []
      target: []
      compiler: []
      modules: {}
      providers: {}
    subversion:
      variants: ~apxs+lz4_internal+perl+utf8proc_internal
      paths: {}
      buildable: true
      version: []
      target: []
      compiler: []
      modules: {}
      providers: {}
    valgrind:
      variants: +lto~ubsan
      paths: {}
      buildable: true
      version: []
      target: []
      compiler: []
      modules: {}
