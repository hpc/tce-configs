  upstreams: {}
  mirrors: {}
  repos: []
  view:
    tce:
      root: $spack/../packages
      link: roots
      exclude:
        - paraview
        - py-mpi4py
      projections:
        # All of the 'core' software should be built once per version and not need qualification
        arm-forge: '{name}/{name}-{version}'
        charliecloud: '{name}/{name}-{version}'
        cmake: '{name}/{name}-{version}'
        emacs: '{name}/{name}-{version}'
        git: '{name}/{name}-{version}'
        gnuplot: '{name}/{name}-{version}'
        hpctoolkit: '{name}/{name}-{version}'
        hpcviewer: '{name}/{name}-{version}'
        htop: '{name}/{name}-{version}'
        idl: '{name}/{name}-{version}'
        julia_binary: 'julia/julia-{version}'
        libyogrt: '{name}/{name}-{version}'
        llvm: '{name}/{name}-{version}'
        mercurial: '{name}/{name}-{version}'
        numactl: '{name}/{name}-{version}'
        openjdk: '{name}/{name}-{version}'
        papi: '{name}/{name}-{version}'
        patchelf: '{name}/{name}-{version}'
        python: '{name}/{name}-{version}'
        py-pint: '{name}/{name}-{version}'
        qt: '{name}/{name}-{version}'
        subversion: '{name}/{name}-{version}'
        totalview: '{name}/{name}-{version}'
        tmux: '{name}/{name}-{version}'
        ^mpi: '{name}/{name}-{version}-{compiler.name}-{compiler.version}-{^mpi.name}-{^mpi.version}'
        all: '{name}/{name}-{version}-{compiler.name}-{compiler.version}'
  modules:
    'default:':
      enable: []
    utils:
      roots:
        tcl: $spack/../modulefiles
      use_view: tce
      enable:
        - tcl
      tcl:
        hash_length: 0
        blacklist_implicits: true
        blacklist:
          - platform=cray
          - platform=linux
        whitelist:
          - arm-forge
          - charliecloud
          - cmake
          - emacs
          - git
          - gnuplot
          - hpctoolkit
          - hpcviewer
          - htop
          - idl
          - java
          - julia_binary
          - libyogrt
          - llvm@7.0.1
          - mercurial
          - numactl
          - openjdk
          - papi
          - patchelf
          - py-pint
          - python
          - qt
          - subversion
          - tmux
          - totalview
        projections:
          julia_binary: 'julia/{version}'
          py-pint: 'pint/{version}'
          all: '{name}/{version}'
        arm-forge:
          environment:
            set:
               # In SLURM versions 20+ they changed default behavior that makes
               # Forge require the following environment variable. This kludge
               # is expected to be addressed in later Forge versions
               ALLINEA_DEBUG_SRUN_ARGS: '%jobid% --mem-per-cpu=0 -I -W0 -G 0 --overlap'
               ALLINEA_NO_TIMEOUT: '1'
        idl:
          environment:
            prepend_path:
              PATH: /usr/tce/packages/idl/idl-8.7/idl87/bin
        libyogrt:
          environment:
            set:
              YOGRT: /usr/tce/packages/libyogrt/libyogrt-1.24
    toolchains:
      roots:
        tcl: $spack/../modulefiles/toolchains
      use_view: tce
      enable:
        - tcl
      tcl:
        hash_length: 0
        blacklist_implicits: true
        blacklist:
          - platform=cray
          - platform=linux
        whitelist:
          - libquo
          - mesa18 +osmesa swr=avx,avx2
          - valgrind
        projections:
          ^mpi: '{compiler.name}-{compiler.version}-{^mpi.name}-{^mpi.version}/{name}/{version}'
          all: '{compiler.name}-{compiler.version}/{name}/{version}'
    # modules that use the root installation rather than pointing to the view
    toolchains-root:
      roots:
        tcl: $spack/../modulefiles/toolchains
      enable:
        - tcl
      tcl:
        hash_length: 0
        blacklist_implicits: true
        blacklist:
          - platform=cray
          - platform=linux
        whitelist:
          - paraview
          - py-mpi4py
        projections:
          py-mpi4py: '{compiler.name}-{compiler.version}-{^mpi.name}-{^mpi.version}/mpi4py/{version}'
          ^mpi: '{compiler.name}-{compiler.version}-{^mpi.name}-{^mpi.version}/{name}/{version}'
          all: '{compiler.name}-{compiler.version}/{name}/{version}'
    prefix_inspections:
      lib:
      - LD_LIBRARY_PATH
      lib64:
      - LD_LIBRARY_PATH
  concretization: separately
