        prefix: /usr
      buildable: false
    openssh:
      externals:
      - spec: openssh@8.0p1
        prefix: /usr
      buildable: false
    perl:
      externals:
      - spec: perl@5.26.3+cpanm+shared+threads
        prefix: /usr
      buildable: false
    pcre:
      externals:
      - spec: pcre@8.42
        prefix: /usr
      version: [8.42]
      buildable: false
    pcre2:
      externals:
      - spec: pcre2@10.32
        prefix: /usr
      buildable: false
    perl-data-dumper:
      externals:
      - spec: perl-data-dumper@2.167
        prefix: /usr
      buildable: false
    pkgconf:
      externals:
      - spec: pkgconf@1.4.2
        prefix: /usr
      buildable: false
    python:
      externals:
      - spec: python@2.7.18+bz2+ctypes+dbm~lzma+nis+pyexpat+readline+sqlite3+ssl~tix~tkinter+uuid+zlib
        prefix: /usr
      - spec: python@3.6.8+bz2+ctypes+dbm+lzma+nis+pyexpat+readline+sqlite3+ssl+tix+tkinter+uuid+zlib
        prefix: /usr
      buildable: false
    py-docutils:
      externals:
      - spec: py-docutils@0.14
