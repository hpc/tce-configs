      variants: +pic
  gitlab-ci:
    rebuild-index: false
    mappings:
    - match:
      - target=x86_64
      runner-attributes:
        tags:
        - quartz1916
        - shell
        before_script:

        # clone and set up spack
        - git clone --branch ${SPACK_CHECKOUT_VERSION} --depth 1 ssh://git@czgitlab.llnl.gov:7999/tce/spack.git
        - . spack/share/spack/setup-env.sh

        # clone and use additional package repo
#        - git clone ssh://git@czgitlab.llnl.gov:7999/tce/spacklemore.git
#        - sed -i "s|/usr/tce/spack/var/spack/repos/spacklemore|`pwd`/spacklemore|"
#          environments/linux-rhel8-x86_64_v3-omnipath-none/spack.yaml

        # ensure spack caches are hot
        - spack compiler find
        - spack spec zlib
        after_script:
        - rm -rf spack
        script:
        - spack env activate --without-view ${SPACK_CONCRETE_ENV_DIR}
        - ./custom_runner
  upstreams: {}
  'mirrors:':
    tce-testnewm: file:///var/tmp/tce/toss4_mirror
    lookaside: https://tossbuild.llnl.gov/lookaside/pkgs/spack/
    koji: file:///repo/spack/tce2/
    spack-public: https://mirror.spack.io
  'repos:':
  - /usr/tce/spack/var/spack/repos/spacklemore
  - $spack/var/spack/repos/builtin

  config:
    misc_cache: $spack/.cache
    install_missing_compilers: true
  'compilers:':
  - compiler:
      spec: gcc@8.3.1
      paths:
        cc: /usr/bin/gcc
        cxx: /usr/bin/g++
        f77: /usr/bin/gfortran
        fc: /usr/bin/gfortran
      flags: {}
      operating_system: rhel8
      target: x86_64
      modules: []
      environment: {}
      extra_rpaths: []
  - compiler:
      spec: gcc@10.2.1
      paths:
        cc: /opt/rh/gcc-toolset-10/root/bin/gcc
        cxx: /opt/rh/gcc-toolset-10/root/bin/g++
        f77: /opt/rh/gcc-toolset-10/root/bin/gfortran
        fc: /opt/rh/gcc-toolset-10/root/bin/gfortran
      flags: {}
      operating_system: rhel8
      target: x86_64
      modules: []
      environment: {}
      extra_rpaths: []
  - compiler:
      spec: aocc@4.5.2.0
      paths:
        cc: /opt/rocm-4.5.2/bin/amdclang
        cxx: /opt/rocm-4.5.2/bin/amdclang++
        f77: /opt/rocm-4.5.2/bin/amdflang
        fc: /opt/rocm-4.5.2/bin/amdflang
      flags: {}
      operating_system: rhel8
      target: x86_64
      modules: []
      environment:
        set:
          HIPCC_PATH: /opt/rocm-4.5.2/bin/hipcc
      extra_rpaths: []
  - compiler:
      spec: aocc@4.5.0.0
      paths:
        cc: /opt/rocm-4.5.0/bin/amdclang
        cxx: /opt/rocm-4.5.0/bin/amdclang++
        f77: /opt/rocm-4.5.0/bin/amdflang
        fc: /opt/rocm-4.5.0/bin/amdflang
      flags: {}
      operating_system: rhel8
      target: x86_64
      modules: []
      environment:
        set:
          HIPCC_PATH: /opt/rocm-4.5.0/bin/hipcc
      extra_rpaths: []
  - compiler:
      spec: aocc@4.3.1.0
      paths:
        cc: /opt/rocm-4.3.1/bin/amdclang
        cxx: /opt/rocm-4.3.1/bin/amdclang++
        f77: /opt/rocm-4.3.1/bin/amdflang
        fc: /opt/rocm-4.3.1/bin/amdflang
      flags: {}
      operating_system: rhel8
      target: x86_64
      modules: []
      environment:
        set:
          HIPCC_PATH: /opt/rocm-4.3.1/bin/hipcc
      extra_rpaths: []
  - compiler:
      spec: aocc@4.2.0.0
      paths:
        cc: /opt/rocm-4.2.0/llvm/bin/clang
        cxx: /opt/rocm-4.2.0/llvm/bin/clang++
        f77: /opt/rocm-4.2.0/llvm/bin/flang
        fc: /opt/rocm-4.2.0/llvm/bin/flang
      flags: {}
      operating_system: rhel8
      target: x86_64
      modules: []
      environment:
        set:
          HIPCC_PATH: /opt/rocm-4.2.0/hip/bin/hipcc
      extra_rpaths: []
  view:
    tce:
      root: /usr/tce/packages
      projections:
        hdf5~mpi: hdf5/hdf5-serial-{version}-{compiler.name}-{compiler.version}
        hdf5+mpi: hdf5/hdf5-parallel-{version}-{compiler.name}-{compiler.version}-{^mpi.name}-{^mpi.version}
        tce-utils-defaults: defaults
        tce-gcc-defaults: defaults
        tce-aocc-defaults: defaults
        tce-cce-defaults: defaults
        llvm: clang/clang-{version}
        tce-wrapper-drivers: '{name}'
        tce-compiler-wrappers%aocc@4.1.0.0: rocmcc-tce/rocmcc-4.1.0
        tce-compiler-wrappers%aocc@4.2.0.0: rocmcc-tce/rocmcc-4.2.0
        tce-compiler-wrappers%aocc@4.2.0.9: rocmcc-tce/rocmcc-4.2.0-cce-12.0.3
        tce-compiler-wrappers%aocc@4.3.0.0: rocmcc-tce/rocmcc-4.3.0
        tce-compiler-wrappers%aocc: rocmcc-tce/rocmcc-{compiler.version}
        tce-compiler-wrappers: '{compiler.name}-tce/{compiler.name}-{compiler.version}'
        tce-mpi-wrappers%aocc@4.1.0.0: '{^mpi.name}-tce/{^mpi.name}-{^mpi.version}-rocmcc-4.1.0'
        tce-mpi-wrappers%aocc@4.2.0.0: '{^mpi.name}-tce/{^mpi.name}-{^mpi.version}-rocmcc-4.2.0'
        tce-mpi-wrappers%aocc@4.2.0.9: '{^mpi.name}-tce/{^mpi.name}-{^mpi.version}-rocmcc-4.2.0-cce-12.0.3'
        tce-mpi-wrappers%aocc@4.3.0.0: '{^mpi.name}-tce/{^mpi.name}-{^mpi.version}-rocmcc-4.3.0'
        tce-mpi-wrappers: '{^mpi.name}-tce/{^mpi.name}-{^mpi.version}-{compiler.name}-{compiler.version}'
        hpctoolkit: '{name}/{name}-{version}'
        ^mpi: '{name}/{name}-{version}-{compiler.name}-{compiler.version}-{^mpi.name}-{^mpi.version}'
        '%gcc@8.3.1': '{name}/{name}-{version}'
        all: '{name}/{name}-{version}-{compiler.name}-{compiler.version}'
      exclude:
      - paraview
      - py-mpi4py
      link_type: symlink
      link: roots
  modules:
    'default:':
      enable: []
    utils:
      roots:
        lmod: /usr/tce/modulefiles
      use_view: tce
      enable:
      - lmod
      lmod:
        hierarchy:
        - mpi
        hash_length: 0
        blacklist_implicits: true
        blacklist:
        - platform=cray
        - platform=linux
        whitelist:
        - ap@1.0
        - arm-forge@21.0
        - charliecloud@0.23
        - cloc@1.84
        - cmake@3.14.5+ownlibs+openssl
        - cmake@3.19.2+ownlibs+openssl
        - cmake@3.21.1+ownlibs+openssl
        - emacs@27.2
        - git@2.29.1+tcltk
        - git@2.31.1+tcltk
        - git-lfs@2.11.0^git@2.29.1+tcltk
        - gnuplot@5.2.8+X~cairo
        - go@1.17.3
        - hpctoolkit@2022.05.15+mpi  # not linked against, no need to use multiple mpis
        - hpcviewer@2022.05
        - htop@3.0.5
#   #    - idl@8.7
        # Tools installation for intel products.
        # Separate mkl installation.
        - julia@1.5.3
#        - julia_binary@1.5.3
        - libyogrt@1.24
        - mercurial@5.8
        - numactl@2.0.14
        - openjdk@11.0.8_10
        - openjdk@1.8.0_222-b10
        - papi@6.0.0.1
        - patchelf@0.10
        - patchelf@0.12
        - patchelf@0.13
        # python2
        # - python@2.7.18
        # preferred python
        # - python@3.8.10
        # latest python
        # - python@3.9.5
        # - py-pint@0.17
        - qt@5.15.2
        - setup-ssh-keys@1.0
        - subversion@1.14.0
        - tce-utils-defaults@1.0
        - tce-wrapper-drivers@18.0
        - totalview@2022.1.16
        - tmux@3.1b
        - xsu@1.0
        - tce-cce-defaults # generate StdEnv.lua
        core_compilers:
        - gcc@8.3.1
        projections:
          py-pint: pint/{version}
          tce-cce-defaults: StdEnv
          all: '{name}/{version}'
    toolchains:
      roots:
        lmod: /usr/tce/modulefiles/toolchains
      use_view: tce
      enable:
      - lmod
      lmod:
        hierarchy:
        - mpi
        hash_length: 0
        blacklist_implicits: true
        blacklist:
        - platform=cray
        - platform=linux
        whitelist:
        - 'gcc@9:'
        - '%gcc@9:'
#        - intel-oneapi-compilers
        - llvm
        - '%clang'
        core_compilers:
        - gcc@8.3.1
        core_specs:
        - tce-compiler-wrappers
        projections:
          llvm: clang/{version}
          hdf5~mpi: '{name}-serial/{version}'
          hdf5+mpi: '{name}-parallel/{version}'
          ^hdf5~mpi: '{name}-serial/{version}'
          ^hdf5+mpi: '{name}-parallel/{version}'
          tce-compiler-wrappers: '{compiler.name}-tce/{compiler.version}'
          tce-mpi-wrappers: '{^mpi.name}-tce/{^mpi.version}'
          all: '{name}/{version}'
        openmpi:
          environment:
            set:
              SLURM_MPI_TYPE: pmix_v3
    toolchains-root:
      roots:
        lmod: /usr/tce/modulefiles/toolchains
      enable:
      - lmod
      lmod:
        hierarchy:
        - mpi
        hash_length: 0
        blacklist_implicits: true
        blacklist:
        - platform=cray
        - platform=linux
        whitelist:
