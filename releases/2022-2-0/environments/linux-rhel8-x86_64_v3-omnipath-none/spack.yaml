# 'when' clause takes a string of python code.
# Available 'when' clause variables are:
#   spack_platform: platform string from spack
#   spack_os: os string of the default Spack architecture on the system
#   spack_target: target string of the default Spack architecture on the system
#   spack_architecture/spack_arch: full string of default Spack architecture
#   re: standard regex module in python
#   env: user environment (os.environ in python)
#   hostname: hostname of the system if 'hostname' in an executable in user path
#
spack:
  definitions:
  - arch:
    - os=rhel8 target=x86_64
  - system-compiler:
    - gcc@8.3.1

# Toss compilers
  - compilers:
    - llvm@12.0.1
    - gcc@10.2.1
  - compilers:
    - intel@19.0.4
    when: '''TCE_BUILD_ALL'' in env or ''TCE_BUILD_INTEL'' in env'
  - compilers:
    - aocc@4.5.2.0
    when: '''TCE_BUILD_ALL'' in env or ''TCE_BUILD_AMD'' in env'
  - compiler-constraints:
    - '%clang@12.0.1'
    - '%gcc@10.2.1'
  - compiler-constraints:
    - '%intel@19.0.4'
    when: '''TCE_BUILD_ALL'' in env or ''TCE_BUILD_INTEL'' in env'
  - compiler-constraints:
    - '%aocc@4.5.2.0'
    when: '''TCE_BUILD_ALL'' in env or ''TCE_BUILD_AMD'' in env'

# Toss MPIs
  - mpis: []
  - mpis:
    - mvapich2@2.3.6 fabrics=mrail process_managers=slurm file_systems=nfs,ufs,lustre
      +wrapperrpath
    - openmpi@4.1.1 fabrics=auto schedulers=slurm +wrapper-rpath
    when: '''TCE_BUILD_ALL'' in env or ''TCE_BUILD_MRAIL'' in env'

# Packages built only once
  - singleton-packages:
    - ap@1.0
    - arm-forge@21.0
    - charliecloud@0.27
    - cloc@1.84
    - cmake@3.14.5+ownlibs+openssl
    - cmake@3.19.2+ownlibs+openssl
    - cmake@3.21.1+ownlibs+openssl
    - emacs@27.2
    - gcc@10.3.1  # redhat clone
    - git@2.29.1+tcltk
    - git@2.31.1+tcltk
    - git-lfs@2.11.0^git@2.29.1+tcltk
    - gnuplot@5.2.8+X~cairo
    - go@1.17.3
    - hpctoolkit@2022.05.15+mpi  # not linked against, no need to use multiple mpis
    - hpcviewer@2022.05
    - htop@3.0.5
#    - idl@8.7
    # Tools installation for intel products.
    # Separate mkl installation.
    - julia@1.5.3
    - libyogrt@1.24
    - mercurial@5.8
    - numactl@2.0.14
    - openjdk@11.0.8_10
    - openjdk@1.8.0_222-b10
    - papi@6.0.0.1
    - patchelf@0.10
    - patchelf@0.12
    - patchelf@0.13
    # python2
    #- python@2.7.18
    # preferred python
    #- python@3.8.10
    # latest python
    #- python@3.9.5
    - py-pint@0.17
    - qt@5.15.2
    - setup-ssh-keys@1.0
    - subversion@1.14.0
    - tce-utils-defaults@1.0
 
    - tce-wrapper-drivers@18.0
    - totalview@2022.1.16
    - tmux@3.1b
    - xsu@1.0

  - compiler-specific-packages:
    - hdf5@1.12.0~mpi+cxx+fortran+hl+shared+threadsafe api=v18
    - mesa18
    - print-openmp-mapping@1.0
    - tce-compiler-wrappers@3.0
    - netcdf-c@4.8.0~mpi~parallel-netcdf+hdf4+pic+shared
    - netcdf-cxx4@4.3.1+pic
    - netcdf-fortran@4.5.3+pic
    - openblas
  - compiler-specific-packages:
    - intel-oneapi-mkl@2021.2.0
    - intel-oneapi-dal@2021.2.0
    - intel-oneapi-tbb@2021.2.0
    when: '''TCE_BUILD_ALL'' in env or ''TCE_BUILD_INTEL'' in env'
  - mpi-times-compiler-packages:
    - hdf5@1.12.0+cxx+fortran+hl+mpi+shared+threadsafe api=v18
    - libquo@1.3.1
    - parallel-netcdf@1.12.2
    - tce-mpi-wrappers@4.0
    - valgrind@3.17.0
    - netcdf-c@4.8.0+hdf4+mpi+parallel-netcdf+pic+shared
    - netcdf-cxx4@4.3.1+pic
    - netcdf-fortran@4.5.3+pic
#    - paraview@5.8.1~vtkm+hdf5+python3+shared+mpi+osmesa+fortran+eyedomelighting+pagosa
#    - paraview@5.9.1~vtkm+hdf5+python3+shared+mpi+osmesa+fortran+eyedomelighting+pagosa

  - cumulative_specs:
    - matrix:
      - [$mpi-times-compiler-packages]
      - [$^mpis]
      - [$compiler-constraints]
      - [$arch]
      exclude:
      - libquo%clang
      - valgrind%clang
      - paraview%clang
    - matrix:
      - [$compiler-specific-packages, $mpis]
      - [$compiler-constraints]
      - [$arch]
      exclude:
      - mesa%clang
    - matrix:
      - [$singleton-packages, $compilers]
      - [$%system-compiler]
      - [$arch]
  specs:
  - $cumulative_specs

  packages:
    all:
      compiler:
      - gcc@8.3.1
      target: [x86_64]
      providers:
        gl:
        - mesa18
        glx:
        - mesa18+glx
        osmesa:
        - mesa18+osmesa
        pkgconfig:
        - pkgconf
        tbb:
        - intel-tbb+shared
        uuid:
        - libuuid
        iconv:
        - libc
    aocc:
      externals:
      - spec: aocc@4.5.2.0
        prefix: /opt/rocm-4.5.2
        version: [4.5.2]
      - spec: aocc@4.5.0.0
        prefix: /opt/rocm-4.5.0
      - spec: aocc@4.3.1.0
