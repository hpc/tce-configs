        prefix: /usr
    bison:
      externals:
      - spec: bison@3.0.4
        prefix: /usr
      version: [3.0.4]
    charliecloud:
      variants: ~docs
      buildable: true
      version: []
      target: []
      compiler: []
      providers: {}
    curl:
      externals:
      - spec: curl@7.61.1 +libssh2+gssapi+nghttp2
        prefix: /usr
      buildable: false
    expat:
      externals:
      - spec: expat@2.2.5~libbsd
        prefix: /usr
      buildable: false
    findutils:
      externals:
      - spec: findutils@4.6.0
        prefix: /usr
      buildable: false
    gcc:
      externals:
      - spec: gcc@10.2.1%gcc@8.3.1
        prefix: /opt/rh/gcc-toolset-10/root
      version: []
      variants: +binutils+cxa_atexit+piclibs+strip+nvptx+profiledbootstrap-lean languages=c,c++,fortran,lto
    gettext:
      externals:
      - spec: gettext@0.19.8.1+curses+libunistring+libxml2~git+xz~tar~bzip2
        prefix: /usr
      version:
      - 0.19.8.1
      variants: +curses+libunistring+libxml2~git+xz~tar~bzip2
    git:
      variants: []
      buildable: true
      version: []
      target: []
      compiler: []
      providers: {}
    glib:
      externals:
      - spec: glib@2.56.4
        prefix: /lib64
      buildable: false
    go:
      externals:
      - spec: go@1.16.12
        prefix: /usr
      version: [1.17.3]
    hdf5:
      buildable: true
      version: []
      target: []
      compiler: []
      providers: {}
    hpctoolkit:
      variants: +mpi+papi
      buildable: true
      version: []
      target: []
      compiler: []
      providers: {}
    hwloc:
      externals:
      - spec: hwloc@2.4.1
        prefix: /usr
      buildable: false
    krb5:
      externals:
      - spec: krb5@1.18.2
        prefix: /usr
      buildable: false
    libc:
      externals:
      - spec: libc@2.28+iconv
        prefix: /
      version:
      - 2.28
      variants: +iconv
    libedit:
      externals:
      - spec: libedit@3.1
        prefix: /usr
      buildable: false
    libfabric:
      externals:
      - spec: libfabric@1.12.0 fabrics=verbs
        prefix: /usr
      buildable: false
    libidn2:
      externals:
      - spec: libidn2@2.2.0
        prefix: /usr
      buildable: false
    libpciaccess:
      externals:
      - spec: libpciaccess@0.14.1
        prefix: /usr
      buildable: false
    libtool:
      externals:
      - spec: libtool@2.4.6
        prefix: /usr
      version:
      - 2.4.6
    libxml2:
      externals:
      - spec: libxml2@2.9.7
        prefix: /usr
      buildable: false
    libyogrt:
      variants: scheduler=slurm
    llvm:
      variants: +all_targets+clang+compiler-rt+omp_tsan+python+lldb+gold+libcxx+polly+internal_unwind
    m4:
      externals:
