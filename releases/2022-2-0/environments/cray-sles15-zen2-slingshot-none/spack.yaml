spack:
  definitions:
# Toss compilers
    - base-compiler:
      - gcc@11.2.0
    - toolchain-compilers-non-base:
      - cce@13.0.0
      - intel-oneapi-compilers@2022.2.0
    - toolchain-compiler-constraints:
      - $%base-compiler
      - '%intel@2022.0.2'
      # - '%clang@13.0.1'
      - '%cce@13.0.0'

    # The same as above, except as a dependency and compiled against a specific compiler
    # A 'feature' of the new concretizer' is that dependencies don't have to use the
    # compiler of the parent, but these (and many other packages) have fortran libs
    # that will break if that happens. So we have to force the builds of some software
    # to use an mpi built against the matching compiler.
    - gcc-10-mpi-constraints:
      - ^mpich@8.1.14

    # The same, for intel.
    - intel-mpi-constraints:
      - ^mpich@8.1.14%gcc
      

    # Note that we don't build anything for clang/mpi combos, so a clang specific
    # section isn't needed currently.

    # Packages built with the default compiler only.
    - base:
      - arm-forge
      - charliecloud ^python@3.10.6
      - cmake
      # We need to specify non-default mesa
      - emacs ^mesa+glx
      - git
      - gnuplot ^cmake@3.23.1%gcc ^python@3.10.6
      - hpcviewer
      - htop ^python@3.10.6
      - idl
      # Tools installation for intel products.
      #- intel-parallel-studio +vtune+advisor+itac~mpi~mkl~ipp~daal~tbb~ilp64~newdtags
      # Separate mkl installation.
      #- intel-parallel-studio ~mpi~ipp~daal~tbb~ilp64~newdtags
      - julia
      - libyogrt
      - mercurial ^python@3.10.6
      - numactl
      - openjdk
      - papi
      - patchelf
      - python
      - py-pint
      - qt ^cmake@3.23.1%gcc
      - subversion ^cmake@3.23.1%gcc
      - totalview
      - tmux
    - base_matrix:
      - exclude: []
        matrix:
        - [$base]
        - [$%base-compiler]

    # Packages built out against each compiler
    - compiler-packages:
      - mesa ^expat%gcc ^glproto%gcc ^libx11%gcc ^libxcb%gcc ^libxml2%gcc@11.2.0
        ^ncurses%gcc ^zlib%gcc ^python@3.10.6

    #
    - install-comp:
      - intel-oneapi-compilers@2022.0.2
      - llvm@14.0.2 ^swig@4.0.2 ^cmake@3.23.1%gcc ^python@3.10.6

      - matrix:
        - [$compiler-packages]
        - [$toolchain-compiler-constraints]

        exclude:
        # Only build parallel studio against intel
        - intel-parallel-studio %gcc
        # - intel-parallel-studio %clang
        - intel-parallel-studio %oneapi
        - intel-oneapi-dal%gcc
        # - intel-oneapi-dal%clang
        - intel-oneapi-dal%intel
        - intel-oneapi-mkl%gcc
        # - intel-oneapi-mkl%clang
        - intel-oneapi-mkl%intel
        - intel-oneapi-tbb%gcc
        # - intel-oneapi-tbb%clang
        - intel-oneapi-tbb%intel
        - mesa%cce

    # Packages to build against all compiler/mpi combinations
    - mpi-packages:
      - hpctoolkit ^cmake@3.23.1%gcc ^python@3.10.6
      - libquo
      - valgrind
      - paraview ^mesa ^bzip2%gcc@11.2.0 ^double-conversion%gcc@11.2.0 ^cmake@3.23.1%gcc
        ^py-matplotlib@3.5.3 ^eigen%gcc@11.2.0 ^expat%gcc@11.2.0 ^freetype%gcc@11.2.0 
        ^libtiff%gcc@11.2.0 ^lz4%gcc@11.2.0 ^lzma%gcc@11.2.0

    # Build the above with gcc and all gcc relevant MPI's
    - toolchain-mpi-gcc-10:
      - matrix:
        - [$mpi-packages]
        - ['%gcc@11.2.0']
        - [$gcc-10-mpi-constraints]
        exclude:
        - hpctoolkit ^mvapich2

    # Build the above with gcc and all intel relevant MPI's
    - toolchain-mpi-intel:
      - matrix:
        - [$mpi-packages]
        - ['%intel@2022.0.2']
        - [$intel-mpi-constraints]
        exclude:
        - hpctoolkit
        - valgrind %intel

    # This defines the actual packages to get installed
    - install:
      - $base_matrix
      - $install-comp
      - $toolchain-mpi-gcc-10
      - $toolchain-mpi-intel

# Final definition
  specs:
  - $install

  # This defines the default settings for each package. The definitions above
  # can be sparse because we define most settings here.
  packages:

    all:
      # Unless otherwise specified, build with gcc
      compiler: [gcc@11.2.0]

      # Virtual packages and which specs provide that functionality.
      providers:
        gl: [mesa]
        glx: [mesa+glx]
        osmesa: [mesa+osmesa swr=avx,avx2]
        pkgconfig: [pkg-config]
        tbb: [intel-tbb+shared]
        uuid: [libuuid]

    # The following crypto libraries should not be built. If needed, they should
    # be pulled from system space.
    botan:
      buildable: false
    cryptopp:
      buildable: false
    gnutls:
      buildable: false
    libsodium:
      buildable: false
    mbedtls:
      variants: +hash_only +pic
      version: [2.16.9]
    nettle:
      buildable: false
    nss:
      buildable: false
    opa-psm2:
      externals:
        - spec: opa-psm2@11.2.78%gcc@11.2.0
          prefix: /usr
      buildable: false
    openssh:
      version: [7.4p1]
      externals:
        - spec: openssh@7.4p1%gcc@11.2.0
          prefix: /usr
      buildable: false
    openssl:
      # This actually seems to be 1.1.0i on Chicoma...
      version: [1.1.1d-rhel]
      externals:
        - spec: openssl@1.1.1d-rhel%gcc@11.2.0~docs+systemcerts
          prefix: /usr
      buildable: false

    # General Package Defaults
    # Version - Each package should have a single default version specified.
    # Variants - If variants are needed, they should be specified here. If we
    #   build multiple conflicting variants (`+foo+bar+baz` and `+foo~bar+baz`)
