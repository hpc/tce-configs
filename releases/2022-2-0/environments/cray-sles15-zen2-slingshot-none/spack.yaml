      projections:
        hdf5~mpi: hdf5/hdf5-serial-{version}-{compiler.name}-{compiler.version}
        hdf5+mpi: hdf5/hdf5-parallel-{version}-{compiler.name}-{compiler.version}-{^mpi.name}-{^mpi.version}
        intel-parallel-studio+mpi: intel-mpi/intel-mpi-{version}
        intel-parallel-studio+mkl: mkl/mkl-{version}
        intel-parallel-studio+vtune: intel-tools/intel-tools-{version}
        # All of the 'core' software should be built once per version and not need qualification
        arm-forge: '{name}/{name}-{version}'
        charliecloud: '{name}/{name}-{version}'
        cmake: '{name}/{name}-{version}'
        emacs: '{name}/{name}-{version}'
        git: '{name}/{name}-{version}'
        gnuplot: '{name}/{name}-{version}'
        hpctoolkit: '{name}/{name}-{version}'
        hpcviewer: '{name}/{name}-{version}'
        htop: '{name}/{name}-{version}'
        idl: '{name}/{name}-{version}'
        julia_binary: 'julia/julia-{version}'
        libyogrt: '{name}/{name}-{version}'
        llvm: clang/clang-{version}
        mercurial: '{name}/{name}-{version}'
        numactl: '{name}/{name}-{version}'
        openjdk: '{name}/{name}-{version}'
        papi: '{name}/{name}-{version}'
        patchelf: '{name}/{name}-{version}'
        python: '{name}/{name}-{version}'
        py-pint: '{name}/{name}-{version}'
        qt: '{name}/{name}-{version}'
        subversion: '{name}/{name}-{version}'
        totalview: '{name}/{name}-{version}'
        tmux: '{name}/{name}-{version}'
        ^mpi: '{name}/{name}-{version}-{compiler.name}-{compiler.version}-{^mpi.name}-{^mpi.version}'
        all: '{name}/{name}-{version}-{compiler.name}-{compiler.version}'
  modules:
    'default:':
      enable: []
    utils:
      roots:
        lmod: $spack/../modulefiles
      use_view: tce
      enable:
        - lmod
      lmod:
        hierarchy:
          - mpi
        hash_length: 0
        blacklist_implicits: true
        blacklist:
          - platform=cray
          - platform=linux
        whitelist:
          - arm-forge
          - charliecloud
          - cmake
          - emacs
          - git
          - gnuplot
          - hpctoolkit
          - hpcviewer
          - htop
          - idl
          - intel-oneapi-mkl
          - intel-oneapi-dal
          - intel-oneapi-tbb
          - intel-oneapi-mpi
          - intel-parallel-studio~mpi
          - java
          - julia_binary
          - libyogrt
          - llvm
          - mercurial
          - numactl
          - openjdk
          - papi
          - patchelf
          - py-pint
          - python
          - qt
          - subversion
          - tmux
          - totalview
        core_compilers:
          - gcc@11.2.0
        core_specs:
          - arm-forge
          - charliecloud
          - cmake
          - emacs
          - git
          - gnuplot
          - hpctoolkit
          - hpcviewer
          - htop
          - idl
          - intel-oneapi-mkl
          - intel-oneapi-dal
          - intel-oneapi-tbb
          - intel-oneapi-mpi
          - intel-parallel-studio~mpi
          - java
          - julia_binary
          - libyogrt
          - llvm
          - mercurial
          - numactl
          - openjdk
          - papi
          - patchelf
          - py-pint
          - python
          - qt 
          - subversion
          - tmux
          - totalview
        projections:
          intel-parallel-studio+mkl: 'mkl/{version}'
          intel-parallel-studio+vtune: 'intel-tools/{version}'
          julia_binary: 'julia/{version}'
          py-pint: 'pint/{version}'
          all: '{name}/{version}'
        arm-forge:
          environment:
            set:
               # In SLURM versions 20+ they changed default behavior that makes
               # Forge require the following environment variable. This kludge
               # is expected to be addressed in later Forge versions
               ALLINEA_DEBUG_SRUN_ARGS: '%jobid% --mem-per-cpu=0 -I -W0 -G 0 --overlap'
               ALLINEA_NO_TIMEOUT: '1'
        idl:
          environment:
            prepend_path:
              PATH: /usr/tce/packages/idl/idl-8.7/idl87/bin
            set:
              IDL_DIR: /usr/tce/packages/idl/idl-8.7/idl87
        libyogrt:
          environment:
            set:
              YOGRT: /usr/tce/packages/libyogrt/libyogrt-1.24
    toolchains:
      roots:
        lmod: $spack/../modulefiles/toolchains
      use_view: tce
      enable:
        - lmod
      lmod:
        hierarchy:
          - mpi
        hash_length: 0
        blacklist_implicits: true
        blacklist:
          - platform=cray
          - platform=linux
        whitelist:
          - gcc
          - hdf5
          - intel-oneapi-compilers
          - intel-parallel-studio+mpi
          - libquo
          - llvm
          - mvapich2
          - netcdf-c
          - netcdf-cxx4
          - netcdf-fortran
          - openmpi
          - parallel-netcdf
          - valgrind
        core_compilers:
          - gcc
        core_specs:
          - gcc
          - intel-oneapi-compilers
          - llvm
        projections:
          gcc: '{name}/{version}'
          hdf5~mpi: '{name}-serial/{version}'
          hdf5+mpi: '{name}-parallel/{version}'
          ^hdf5~mpi: '{name}-serial/{version}'
          ^hdf5+mpi: '{name}-parallel/{version}'
          intel-oneapi-compilers: 'intel/{version}'
          intel-parallel-studio+mpi: 'intel-mpi/{version}'
          llvm: 'clang/{version}'
          all: '{name}/{version}'
        llvm:
          environment:
            prepend_path:
              PATH: /usr/tce/packages/gcc/gcc-11.2.0-gcc-4.8.5/bin
              LD_LIBRARY_PATH: /usr/tce/packages/gcc/gcc-11.2.0-gcc-4.8.5/lib64
            set:
              FC:  /usr/tce/packages/gcc/gcc-11.2.0-gcc-4.8.5/bin/gfortran
              F90:  /usr/tce/packages/gcc/gcc-11.2.0-gcc-4.8.5/bin/gfortran
        intel-oneapi-compilers:
          environment:
            prepend_path:
              MODULEPATH: /usr/tce/modulefiles/toolchains/linux-rhel7-x86_64/intel/2022.0.2
              PATH: /usr/tce/packages/gcc/gcc-11.2.0-gcc-4.8.5/bin
              LD_LIBRARY_PATH: /usr/tce/packages/gcc/gcc-11.2.0-gcc-4.8.5/lib64
            set:
              GCC: /usr/tce/packages/gcc/gcc-11.2.0-gcc-4.8.5
        intel-parallel-studio+mpi:
          environment:
            prepend_path:
              PATH: /usr/tce/packages/intel-mpi/intel-mpi-cluster.2020.4/compilers_and_libraries_2020.4.304/linux/mpi/intel64/bin
            set:
              MANPATH: /usr/tce/packages/intel-mpi/intel-mpi-cluster.2020.4/compilers_and_libraries_2020.4.304/linux/mpi/man
        openmpi:
          environment:
            set:
              SLURM_MPI_TYPE: pmix_v3
              HWLOC_ROOT: '{^hwloc.prefix}'
              HWLOC_HOME: '{^hwloc.prefix}'
        mvapich2:
          environment:
            prepend_path:
              PATH: /usr/tce/packages/binutils/binutils-2.36.1-gcc-11.2.0/bin
    # modules that use the root installation rather than pointing to the view
    toolchains-root:
      roots:
        lmod: $spack/../modulefiles/toolchains
      enable:
        - lmod
      lmod:
        hierarchy:
          - mpi
        hash_length: 0
        blacklist_implicits: true
        blacklist:
          - platform=cray
          - platform=linux
        whitelist:
          - paraview
          - py-mpi4py
        core_compilers:
          - gcc
        projections:
          py-mpi4py: 'mpi4py/{version}'
          all: '{name}/{version}'
    prefix_inspections:
      lib:
      - LD_LIBRARY_PATH
      lib64:
      - LD_LIBRARY_PATH
  concretizer:
    unify: when_possible
