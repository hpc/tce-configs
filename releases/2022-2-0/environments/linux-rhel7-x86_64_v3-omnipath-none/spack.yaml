  upstreams: {}
  mirrors: {}
  repos: []
  view:
    tce:
      root: $spack/../packages
      link: roots
      exclude:
        - paraview
        - py-mpi4py
      projections:
        hdf5~mpi: hdf5/hdf5-serial-{version}-{compiler.name}-{compiler.version}
        hdf5+mpi: hdf5/hdf5-parallel-{version}-{compiler.name}-{compiler.version}-{^mpi.name}-{^mpi.version}
        intel-parallel-studio+mpi: intel-mpi/intel-mpi-{version}
        intel-parallel-studio+mkl: mkl/mkl-{version}
        intel-parallel-studio+vtune: intel-tools/intel-tools-{version}
        # All of the 'core' software should be built once per version and not need qualification
        arm-forge: '{name}/{name}-{version}'
        charliecloud: '{name}/{name}-{version}'
        cmake: '{name}/{name}-{version}'
        emacs: '{name}/{name}-{version}'
        git: '{name}/{name}-{version}'
