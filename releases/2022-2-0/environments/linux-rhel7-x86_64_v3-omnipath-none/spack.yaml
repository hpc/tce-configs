          - julia_binary
          - libyogrt
          - llvm@7.0.1
          - mercurial
          - numactl
          - openjdk
          - papi
          - patchelf
          - py-pint
          - python
          - qt
          - subversion
          - tmux
          - totalview
        core_compilers:
          - gcc@10.3.0
        core_specs:
          - arm-forge
          - charliecloud
          - cmake
          - emacs
          - git
          - gnuplot
          - hpctoolkit
          - hpcviewer
          - htop
          - idl
          - intel-oneapi-mkl
          - intel-oneapi-dal
          - intel-oneapi-tbb
          - intel-oneapi-mpi
          - intel-parallel-studio~mpi
          - java
          - julia_binary
          - libyogrt
          - llvm@7.0.1
          - mercurial
          - numactl
          - openjdk
          - papi
          - patchelf
          - py-pint
          - python
          - qt
          - subversion
          - tmux
          - totalview
        projections:
          intel-parallel-studio+mkl: 'mkl/{version}'
          intel-parallel-studio+vtune: 'intel-tools/{version}'
          julia_binary: 'julia/{version}'
          py-pint: 'pint/{version}'
          all: '{name}/{version}'
        arm-forge:
          environment:
            set:
               # In SLURM versions 20+ they changed default behavior that makes
               # Forge require the following environment variable. This kludge
               # is expected to be addressed in later Forge versions
               ALLINEA_DEBUG_SRUN_ARGS: '%jobid% --mem-per-cpu=0 -I -W0 -G 0 --overlap'
               ALLINEA_NO_TIMEOUT: '1'
        idl:
          environment:
            prepend_path:
              PATH: /usr/tce/packages/idl/idl-8.7/idl87/bin
            set:
              IDL_DIR: /usr/tce/packages/idl/idl-8.7/idl87
        libyogrt:
          environment:
            set:
              YOGRT: /usr/tce/packages/libyogrt/libyogrt-1.24
    toolchains:
      roots:
        lmod: $spack/../modulefiles/toolchains
      use_view: tce
      enable:
        - lmod
      lmod:
        hierarchy:
          - mpi
        hash_length: 0
        blacklist_implicits: true
        blacklist:
          - platform=cray
          - platform=linux
        whitelist:
          - gcc
          - hdf5
          - intel-oneapi-compilers
          - intel-parallel-studio+mpi
          - libquo
          - llvm@12.0.0
          - mesa18 +osmesa swr=avx,avx2
          - mvapich2
          - netcdf-c
          - netcdf-cxx4
          - netcdf-fortran
          - openmpi
          - parallel-netcdf
          - valgrind
        core_compilers:
          - gcc@4.8.5
        core_specs:
          - gcc
          - intel-oneapi-compilers
          - llvm@12.0.0
        projections:
          gcc: '{name}/{version}'
          hdf5~mpi: '{name}-serial/{version}'
          hdf5+mpi: '{name}-parallel/{version}'
          ^hdf5~mpi: '{name}-serial/{version}'
          ^hdf5+mpi: '{name}-parallel/{version}'
          intel-oneapi-compilers: 'intel/{version}'
          intel-parallel-studio+mpi: 'intel-mpi/{version}'
          llvm: 'clang/{version}'
          all: '{name}/{version}'
        llvm@12.0.0:
          environment:
            prepend_path:
              PATH: /usr/tce/packages/gcc/gcc-10.3.0-gcc-4.8.5/bin
              LD_LIBRARY_PATH: /usr/tce/packages/gcc/gcc-10.3.0-gcc-4.8.5/lib64
            set:
              FC:  /usr/tce/packages/gcc/gcc-10.3.0-gcc-4.8.5/bin/gfortran
              F90:  /usr/tce/packages/gcc/gcc-10.3.0-gcc-4.8.5/bin/gfortran
        intel-oneapi-compilers:
          environment:
            prepend_path:
              MODULEPATH: /usr/tce/modulefiles/toolchains/linux-rhel7-x86_64/intel/2021.2.0
              PATH: /usr/tce/packages/gcc/gcc-10.3.0-gcc-4.8.5/bin
              LD_LIBRARY_PATH: /usr/tce/packages/gcc/gcc-10.3.0-gcc-4.8.5/lib64
            set:
              GCC: /usr/tce/packages/gcc/gcc-10.3.0-gcc-4.8.5
        intel-parallel-studio+mpi:
          environment:
            prepend_path:
              PATH: /usr/tce/packages/intel-mpi/intel-mpi-cluster.2020.4/compilers_and_libraries_2020.4.304/linux/mpi/intel64/bin
            set:
              MANPATH: /usr/tce/packages/intel-mpi/intel-mpi-cluster.2020.4/compilers_and_libraries_2020.4.304/linux/mpi/man
        openmpi:
          environment:
            set:
              SLURM_MPI_TYPE: pmix_v3
              HWLOC_ROOT: '{^hwloc.prefix}'
              HWLOC_HOME: '{^hwloc.prefix}'
        mvapich2:
          environment:
            prepend_path:
              PATH: /usr/tce/packages/binutils/binutils-2.36.1-gcc-10.3.0/bin
    # modules that use the root installation rather than pointing to the view
    toolchains-root:
      roots:
        lmod: $spack/../modulefiles/toolchains
      enable:
        - lmod
      lmod:
        hierarchy:
          - mpi
        hash_length: 0
        blacklist_implicits: true
        blacklist:
          - platform=cray
          - platform=linux
        whitelist:
          - paraview
          - py-mpi4py
        core_compilers:
