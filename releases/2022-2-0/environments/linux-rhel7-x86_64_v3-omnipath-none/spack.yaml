# 'when' clause takes a string of python code.
# Available 'when' clause variables are:
#   spack_platform: platform string from spack
#   spack_os: os string of the default Spack architecture on the system
#   spack_target: target string of the default Spack architecture on the system
#   spack_architecture/spack_arch: full string of default Spack architecture
#   re: standard regex module in python
#   env: user environment (os.environ in python)
#   hostname: hostname of the system if 'hostname' in an executable in user path
#
#
spack:
  definitions:
    - arch:
      - os=rhel8 target=x86_64
    - system-compiler:
      - gcc@4.8.5

# Toss compilers
    - base-compiler:
      - gcc@10.3.0
    - base-compiler-to-install:
      - gcc@10.3.0%gcc@4.8.5 ^binutils+gold+ld+gas
    - toolchain-compilers-non-base: []
    - toolchain-compilers-non-base:
      - intel-oneapi-compilers@2021.2.0
      when: '''TCE_BUILD_ALL'' in env or ''TCE_BUILD_INTEL'' in env'
    - toolchain-compilers-non-base:
      - llvm@12.0.0
      when: '''TCE_BUILD_ALL'' in env or ''TCE_BUILD_CLANG'' in env'
    - toolchain-compiler-constraints:
      - $%base-compiler
    - toolchain-compiler-constraints:
      - '%intel@2021.2.0'
      when: '''TCE_BUILD_ALL'' in env or ''TCE_BUILD_INTEL'' in env'
    - toolchain-compiler-constraints:
      - '%clang@12.0.0'
      when: '''TCE_BUILD_ALL'' in env or ''TCE_BUILD_CLANG'' in env'
# Toss MPIs
    - toolchain-mpi-constraints: []
    - toolchain-mpi-constraints:
      - ^intel-parallel-studio@cluster.2020.4
      when: '''TCE_BUILD_ALL'' in env or ''TCE_BUILD_INTEL_MPI'' in env'
    - toolchain-mpi-constraints:
      - ^openmpi@4.1.1
      when: '''TCE_BUILD_ALL'' in env or ''TCE_BUILD_OPENMPI'' in env'
    - toolchain-mpi-constraints:
      - ^mvapich2@2.3.6
      when: '''TCE_BUILD_ALL'' in env or ''TCE_BUILD_MVAPICH2'' in env'
    - toolchain-mpi: []
    - toolchain-mpi:
      - intel-parallel-studio@cluster.2020.4+mpi+ilp64+newdtags
      when: '''TCE_BUILD_ALL'' in env or ''TCE_BUILD_INTEL_MPI'' in env'
    - toolchain-mpi:
      - openmpi@4.1.1
      when: '''TCE_BUILD_ALL'' in env or ''TCE_BUILD_OPENMPI'' in env'
    - toolchain-mpi:
      - mvapich2@2.3.6
      when: '''TCE_BUILD_ALL'' in env or ''TCE_BUILD_MVAPICH2'' in env'
# Packages built only once
    - singleton-packages:
      - ap@1.0
      - arm-forge@21.0
      - charliecloud@0.23
      - cloc@1.84
      - cmake@3.20.3
      - emacs@27.2+X ^mesa18+glx
      - git@2.31.1
      - git-lfs@2.11.0^git@2.31.1
      - gnuplot@5.2.8+X~cairo
      - go@1.17.3
      - htop@3.0.5
      - idl@8.7
      # Tools installation for intel products.
      - intel-parallel-studio@cluster.2020.4+vtune+advisor+itac~mpi~mkl~ipp~daal~tbb~ilp64~newdtags
      # Separate mkl installation.
      - intel-parallel-studio@cluster.2020.4~mpi~ipp~daal~tbb~ilp64~newdtags
      - julia@1.5.3
      - libyogrt@1.24
      - mercurial@5.8
      - numactl@2.0.14
      - openjdk@11.0.8_10
      - papi@6.0.0.1
      - patchelf@0.13
      - python@2.7.18
      - python@3.8.10
      - python@3.9.5
      - py-pint@0.17
      - qt@5.15.2
      - setup-ssh-keys@1.0
      - subversion@1.14.0
      - tce-utils-defaults@1.0
      - tce-wrapper-drivers@18.0
      - totalview@2021.1.16
      - tmux@3.1b
# Packages built out across the all compilers
    - compiler-packages:
      - $toolchain-mpi
      - hdf5@1.12.0~mpi+cxx+fortran+hl+pic+shared+threadsafe api=v18
      - intel-oneapi-mkl@2021.2.0
      - intel-oneapi-dal@2021.2.0
      - intel-oneapi-tbb@2021.2.0
      - mesa18
      - netcdf-c@4.8.0~mpi~parallel-netcdf+hdf4+pic+shared
      - netcdf-cxx4@4.3.1+pic
      - netcdf-fortran@4.5.3+pic
      - openblas
      - print-openmp-mapping@1.0
      - tce-compiler-wrappers@3.0
# Packages built out across the all compilers and MPIs
    - toolchain-packages:
      - hpctoolkit
      - libquo
      - netcdf-c@4.8.0+hdf4+mpi+parallel-netcdf+pic+shared
      - netcdf-cxx4@4.3.1+pic
      - netcdf-fortran@4.5.3+pic
      - paraview@5.9.1~vtkm+hdf5+python3+shared+mpi+osmesa+fortran+eyedomelighting+pagosa
      - tce-mpi-wrappers@4.0
      - valgrind
# Defines a matrix to populate with Spack Stacks
    # Allows for the definition of build matrices for multiple quarters to be
    # built all at once (e.g. - with a new machine)
    - install:
      # Install the base compiler
      - matrix:
        - [$base-compiler]
        - [$%system-compiler]
        - [$arch]
      - matrix:
        - [$compilers]
        - [$%base-compiler]
        - [$arch]
      - matrix:
        - [$singleton-packages]
        - [$%base-compiler]
        - [$arch]
      - matrix:
        - [$compiler-packages]
        - [$toolchain-compiler-constraints]
        - [$arch]
        exclude:
        - intel-parallel-studio %gcc
        - intel-parallel-studio %clang
        - intel-parallel-studio %oneapi
        - intel-oneapi-dal%gcc
        - intel-oneapi-dal%clang
        - intel-oneapi-dal%intel
        - intel-oneapi-mkl%gcc
        - intel-oneapi-mkl%clang
        - intel-oneapi-mkl%intel
        - intel-oneapi-tbb%gcc
        - intel-oneapi-tbb%clang
        - intel-oneapi-tbb%intel
        - mesa18%clang
      - matrix:
        - [$toolchain-packages]
        - [$toolchain-mpi-constraints]
        - [$toolchain-compiler-constraints]
        - [$arch]
        exclude:
        - '%clang'
        # intel-mpi not built out for other compilers
        - '%gcc ^intel-parallel-studio'
        - '%gcc ^intel-oneapi-mpi'
        - '%clang ^intel-parallel-studio'
        - hpctoolkit %intel
        - hpctoolkit %oneapi
        - hpctoolkit ^mvapich2
        - libquo %oneapi ^intel-parallel-studio
        - netcdf-cxx4 ^intel-parallel-studio
        - netcdf-fortran ^intel-parallel-studio
        - paraview ^intel-parallel-studio
        - paraview ^mvapich2
        - valgrind %intel # https://github.com/spack/spack/issues/16328 Boost C++11/Intel issue.
        - valgrind %oneapi ^intel-parallel-studio
# Final definition
