spack:
  definitions:
# Toss compilers
    - base-compiler:
      - gcc@10.3.0
    - toolchain-compilers-non-base:
      - intel-oneapi-compilers@2021.2.0
      - llvm@12.0.0
    - toolchain-compiler-constraints:
      - $%base-compiler
      - '%intel@2021.2.0'
      - '%clang@12.0.0'
# Toss MPIs
    - gcc-mpi-constraints:
      - ^openmpi%gcc@10.3.0 +pmix
        ^hwloc%gcc 
        ^libevent%gcc 
        ^numactl%gcc 
        ^pkgconf%gcc
        ^pmix%gcc 
      - ^mvapich2%gcc@10.3.0
        ^bison%gcc 
        ^findutils%gcc 
        ^libpciaccess%gcc 
        ^libxml2%gcc 
        ^pkgconf%gcc

    - intel-mpi-constraints:
      - ^openmpi%intel@2021.2.0 +pmix
        ^hwloc%gcc 
        ^libevent%gcc 
        ^numactl%gcc 
        ^pkgconf%gcc
        ^pmix%gcc 
      - ^mvapich2%intel@2021.2.0
        ^bison%gcc 
        ^findutils%gcc 
        ^libpciaccess%gcc 
        ^libxml2%gcc 
        ^pkgconf%gcc

    - toolchain-mpi:
      - intel-parallel-studio@cluster.2020.4+mpi+ilp64+newdtags
      - openmpi
        ^hwloc%gcc 
        ^libevent%gcc 
        ^numactl%gcc 
        ^pkgconf%gcc
        ^pmix%gcc 
      - mvapich2
        ^bison%gcc 
        ^findutils%gcc 
        ^libpciaccess%gcc 
        ^libxml2%gcc 
        ^pkgconf%gcc
    # Packages built with the default compiler only.
    - base:
      - arm-forge
      - charliecloud
      - cmake
      # We need to specify non-default mesa
      - emacs ^mesa18+glx
      - git
      - gnuplot
      - hpcviewer
      - htop
      - idl
      # Tools installation for intel products.
      - intel-parallel-studio +vtune+advisor+itac~mpi~mkl~ipp~daal~tbb~ilp64~newdtags
      # Separate mkl installation.
      - intel-parallel-studio ~mpi~ipp~daal~tbb~ilp64~newdtags
      - julia_binary
      - libyogrt
      - mercurial
      - numactl
      - openjdk
      - openssh
      - papi
      - patchelf
      - python@2.7.18
      - python@3.8.10
      - python@3.9.5
      - py-pint
      - qt
      - subversion
      - totalview
      - tmux
    - base_matrix:
      - exclude: []
        matrix:
        - [$base]
        - [$%base-compiler]
# Define base deps to reuse
# Packages built out across the all compilers
    - compiler-packages:
      - $toolchain-mpi
      - hdf5@1.12.0~mpi+cxx+fortran+hl+shared+threadsafe api=v18 ^zlib%gcc
      - intel-oneapi-mkl@2021.2.0
      - intel-oneapi-dal@2021.2.0
      - intel-oneapi-tbb@2021.2.0
      - mesa18 ^expat%gcc ^glproto%gcc ^libx11%gcc ^libxcb%gcc ^libxml2%gcc@10.3.0 ^llvm@7.0.1%gcc 
        ^ncurses%gcc ^zlib%gcc
      - netcdf-c 
      - netcdf-cxx4
      - netcdf-fortran
# Defines a matrix to populate with Spack Stacks
    - install-comp:
      - exclude:
        - intel-parallel-studio %gcc
        - intel-parallel-studio %clang
        - intel-parallel-studio %oneapi
        - intel-oneapi-dal%gcc
        - intel-oneapi-dal%clang
        - intel-oneapi-dal%intel
        - intel-oneapi-mkl%gcc
        - intel-oneapi-mkl%clang
        - intel-oneapi-mkl%intel
        - intel-oneapi-tbb%gcc
        - intel-oneapi-tbb%clang
        - intel-oneapi-tbb%intel
        - mesa18%clang
        matrix:
        - [$compiler-packages]
        - [$toolchain-compiler-constraints]
        # Base dependency constraints
# Packages built out across the all compilers and MPIs
      - intel-oneapi-compilers@2021.2.0
      - llvm@12.0.0

    - mpi-packages:
      - hdf5 +mpi
      - hdf5 +mpi
      - hpctoolkit 
      - libquo
      - valgrind
      - netcdf-cxx4 ^hdf5 +mpi ^parallel-netcdf 
      - netcdf-fortran ^hdf5 +mpi ^parallel-netcdf
      - paraview ^mesa18

    - toolchain-mpi-gcc:
      - matrix:
        - [$mpi-packages]
        - ['%gcc@10.3.0']
        - [$gcc-mpi-constraints]
        exclude:
        - hpctoolkit ^mvapich2

    - toolchain-mpi-intel:
      - matrix:
        - [$mpi-packages]
        - ['%intel@2021.2.0']
        - [$intel-mpi-constraints]
        exclude:
        - hpctoolkit
        - valgrind %intel

# Defines a matrix to populate with Spack Stacks
    #- install-comp-mpi:
    #  - exclude:
    #    - '%clang'
    #    # intel-mpi not built out for other compilers
    #    - '%gcc ^intel-parallel-studio'
    #    - '%gcc ^intel-oneapi-mpi'
    #    - '%clang ^intel-parallel-studio'
    #    - hpctoolkit %clang
    #    - hpctoolkit %intel
    #    - hpctoolkit %oneapi
    #    - hpctoolkit ^mvapich2
    #    - libquo %clang
    #    - libquo %oneapi ^intel-parallel-studio
    #    - valgrind %intel # https://github.com/spack/spack/issues/16328 Boost C++11/Intel issue.
    #    - valgrind %oneapi ^intel-parallel-studio
    #    - valgrind %clang
    
    - install:
      - $base_matrix
      - $install-comp
      - $toolchain-mpi-gcc
      - $toolchain-mpi-intel

# Final definition
  specs:
  - $install
  packages:
    all:
      compiler: [gcc@10.3.0]
      providers:
        gl: [mesa18]
        glx: [mesa18+glx]
