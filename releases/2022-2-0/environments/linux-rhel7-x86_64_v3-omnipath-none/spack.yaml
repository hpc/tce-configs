        mvapich2:
          environment:
            prepend_path:
              PATH: /usr/tce/packages/binutils/binutils-2.36.1-gcc-10.3.0/bin
    # modules that use the root installation rather than pointing to the view
    toolchains-root:
      roots:
        lmod: $spack/../modulefiles/toolchains
      enable:
        - lmod
      lmod:
        hierarchy:
          - mpi
        hash_length: 0
        blacklist_implicits: true
        blacklist:
          - platform=cray
          - platform=linux
        whitelist:
          - paraview
          - py-mpi4py
        core_compilers:
          - gcc@4.8.5
        projections:
          py-mpi4py: 'mpi4py/{version}'
          all: '{name}/{version}'
    prefix_inspections:
      lib:
      - LD_LIBRARY_PATH
      lib64:
      - LD_LIBRARY_PATH
  concretization: separately
