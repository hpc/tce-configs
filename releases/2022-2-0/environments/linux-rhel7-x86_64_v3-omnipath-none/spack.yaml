        projections:
          intel-parallel-studio+mkl: 'mkl/{version}'
          intel-parallel-studio+vtune: 'intel-tools/{version}'
          julia_binary: 'julia/{version}'
          py-pint: 'pint/{version}'
          all: '{name}/{version}'
        arm-forge:
          environment:
            set:
               # In SLURM versions 20+ they changed default behavior that makes
               # Forge require the following environment variable. This kludge
               # is expected to be addressed in later Forge versions
               ALLINEA_DEBUG_SRUN_ARGS: '%jobid% --mem-per-cpu=0 -I -W0 -G 0 --overlap'
               ALLINEA_NO_TIMEOUT: '1'
        idl:
          environment:
            prepend_path:
              PATH: /usr/tce/packages/idl/idl-8.7/idl87/bin
            set:
              IDL_DIR: /usr/tce/packages/idl/idl-8.7/idl87
        libyogrt:
          environment:
            set:
              YOGRT: /usr/tce/packages/libyogrt/libyogrt-1.24
