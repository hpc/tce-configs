spack:
  definitions:
    - base-compiler:
      - gcc@11.2.0
    - toolchain-compiler-constraints:
      - $%base-compiler
      - '%intel@19.1.3'
      - '%intel@2022.2.1'
      - '%intel@2021.7.1.classic'
      - '%oneapi@2022.2.1'
      - '%cce@15.0.0'

    - target:
      - target=x86_64_v3

    # The same as above, except as a dependency and compiled against a specific compiler
    # A 'feature' of the new concretizer' is that dependencies don't have to use the
    # compiler of the parent, but these (and many other packages) have fortran libs
    # that will break if that happens. So we have to force the builds of some software
    # to use an mpi built against the matching compiler.
    - gcc-10-mpi-constraints:
      - ^cray-mpich@8.1.21%gcc@11.2.0 os=sles15

    # The same, for intel.
    - intel-mpi-constraints:
      - ^cray-mpich@8.1.21%intel@2022.2.1 os=sles15

    - intel-classic-mpi-constraints:
      - ^cray-mpich@8.1.21%intel@2021.7.1.classic os=sles15

    - oneapi-mpi-constraints:
      - ^cray-mpich@8.1.21%oneapi os=sles15

    - cce-mpi-constraints:
      - ^cray-mpich@8.1.21%cce os=sles15

    # Note that we don't build anything for clang/mpi combos, so a clang specific
    # section isn't needed currently.

    # Packages built with the default compiler only.
    - base:
      - arm-forge
      - charliecloud ^python@3.10.6%gcc
      - cmake
      # We need to specify non-default mesa
      - emacs +X ^mesa+glx
      - git
      - gnuplot ^cmake@3.23.1%gcc ^python@3.10.6%gcc
      - hpcviewer
      - htop ^python@3.10.6%gcc
      - idl
      - intel-mkl
      - julia_binary
      - libyogrt
      - mercurial ^python@3.10.6%gcc
      - numactl
      - openjdk
      - papi
      - patchelf
      - python %gcc
      - py-matplotlib
      - py-pint
      - qt ^cmake@3.23.1%gcc
      - subversion ^cmake@3.23.1%gcc
      - tmux
      - totalview
    - base_matrix:
      - exclude: []
        matrix:
        - [$base]
        - [$%base-compiler]
        - [$target]

    # Packages built out against each compiler
    - compiler-packages:
      - mesa ^expat%gcc ^glproto%gcc ^libx11%gcc ^libxcb%gcc ^libxml2%gcc@11.2.0
        ^ncurses%gcc ^zlib%gcc ^python@3.10.6%gcc

    #
    - install-comp:
      #- intel-oneapi-compilers@2022.2.1
      - llvm@14.0.2 ^swig@4.0.2 ^cmake@3.23.1%gcc ^python@3.10.6%gcc

      - matrix:
        - [$compiler-packages]
        - [$toolchain-compiler-constraints]
        - [$target]

        exclude:
        # Only build parallel studio against intel
        - intel-mkl@gcc
        - mesa%cce
        - mesa%oneapi
        - mesa%intel@2022.2.1

    # Packages to build against all compiler/mpi combinations
    - mpi-packages:
      - hpctoolkit ^cmake@3.23.1%gcc ^python@3.10.6%gcc
      - libquo
      - valgrind
      - survey
      - paraview@5.10.1 ~adios2 ^mesa ^bzip2%gcc@11.2.0 ^double-conversion%gcc@11.2.0 ^cmake@3.23.1%gcc
        ^py-matplotlib@3.5.3%gcc ^eigen%gcc@11.2.0 ^expat%gcc@11.2.0 ^freetype%gcc@11.2.0
        ^libtiff%gcc@11.2.0 ^lz4%gcc@11.2.0
      - py-mpi4py

    # Build the above with gcc and all gcc relevant MPI's
    - toolchain-mpi-gcc-10:
      - matrix:
        - [$mpi-packages]
        - ['%gcc@11.2.0']
        - [$gcc-10-mpi-constraints]
        - [$target]
        exclude: []

    # Build the above with intel hybrid (oneapi with old fortran compiler)
    - toolchain-mpi-intel:
      - matrix:
        - [$mpi-packages]
        - ['%intel@2022.2.1']
        - [$intel-mpi-constraints]
        - [$target]
        exclude:
        - hpctoolkit
        # - paraview
        # - valgrind %intel

    # Build the above with intel classic
    - toolchain-mpi-intel-classic:
      - matrix:
        - [$mpi-packages]
        - ['%intel@2021.7.1.classic']
        - [$intel-classic-mpi-constraints]
        - [$target]
        exclude:
        - hpctoolkit
        # - paraview
        # - valgrind %intel

    # Build the above with oneapi
    - toolchain-mpi-oneapi:
      - matrix:
        - [$mpi-packages]
        - ['%oneapi@2022.2.1']
        - [$oneapi-mpi-constraints]
        - [$target]
        exclude:
        - hpctoolkit
        # - paraview
        # - valgrind %oneapi

    # Build the above with intel 19.1.3
    - toolchain-mpi-intel19:
      - matrix:
        - [$mpi-packages]
        - ['%intel@19.1.3']
        - [$intel-classic-mpi-constraints]
        - [$target]
        exclude:
        - hpctoolkit
        - paraview
        # - valgrind %intel

    # Build the above with cce
    - toolchain-mpi-cce:
      - matrix:
        - [$mpi-packages]
        - ['%cce@15.0.0']
        - [$cce-mpi-constraints]
        - [$target]
        exclude:
        - hpctoolkit
        - paraview
        - valgrind %cce

    # This defines the actual packages to get installed
    - install:
      - $base_matrix
      - $install-comp
      - $toolchain-mpi-gcc-10
      - $toolchain-mpi-intel
      - $toolchain-mpi-intel-classic
      - $toolchain-mpi-oneapi
      - $toolchain-mpi-intel19
      - $toolchain-mpi-cce

# Final definition
  specs:
  - $install

  # This defines the default settings for each package. The definitions above
  # can be sparse because we define most settings here.
  packages:

    all:
      # Unless otherwise specified, build with gcc
      compiler: [gcc@11.2.0]

      # Virtual packages and which specs provide that functionality.
      providers:
        gl: [mesa]
        osmesa: [mesa+osmesa swr=avx,avx2]
        pkgconfig: [pkg-config]
        tbb: [intel-tbb+shared]
        uuid: [libuuid]

    # The following crypto libraries should not be built. If needed, they should
    # be pulled from system space.
    botan:
      buildable: false
    cryptopp:
      buildable: false
    gnutls:
      buildable: false
    libsodium:
      buildable: false
    mbedtls:
      buildable: false
    nettle:
      buildable: false
    nss:
      buildable: false
    # opa-psm2: #DEBUG
    #   externals:
    #     - spec: opa-psm2@11.2.78%gcc@11.2.0
    #       prefix: /usr
    #   buildable: false
    openssh:
      version: [8.4p1]
      externals:
        - spec: openssh@8.4p1%gcc@11.2.0
          prefix: /usr
      buildable: false
    openssl:
      version: ['1.1.1d-rhel']
      externals:
        - spec: openssl@1.1.1d-rhel%gcc@11.2.0~docs+systemcerts
          prefix: /usr
      buildable: false

    # General Package Defaults
    # Version - Each package should have a single default version specified.
    # Variants - If variants are needed, they should be specified here. If we
    #   build multiple conflicting variants (`+foo+bar+baz` and `+foo~bar+baz`)
    #   specify the intersection of those (`+foo+baz`). You can then specify the package
    #   with only those variants that differ above.
    # Compiler - Should not be set.
    apr:
      version: [1.6.2]
    apr-util:
      version: [1.6.1]
    arm-forge:
      require: '%gcc'
      variants: +accept-eula
      version: ['22.1.1']
    at-spi2-atk:
      variants: default_library=shared
      version: [2.38.0]
    at-spi2-core:
      variants: default_library=shared
      version: [2.40.1]
    atk:
      version: [2.36.0]
    autoconf:
      version: ['2.69']
    automake:
      version: ['1.16.5']
    bdftopcf:
      version: ['1.0.5']
    binutils:
