# This file is imported by both .gitlab-ci.yml and it's generated child scripts
# to define the basis for common runs.

.build_environment:
  stage: build
  artifacts:
    paths:
        - builds__/*/logs/*
        - builds__/*/spack/var/spack/environments/$TCE_RELEASE/spack.lock
    expire_in: 1 week
  dependencies: [] # Don't download previous stage artifacts
  variables:
    CERT_STORE: /usr/projects/hpctools/gitlab-ci/cert_store
    TCE_FACILITY: <override me>
    TCE_ENVIRONMENT: <override me>
    TCE_RELEASE: <override me>
    FACILITIES_BRANCH: chicoma 
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - .gitlab-ci.yml
        - .ci-base.yml
        - bin/*
        - releases/$TCE_RELEASE/environments/$TCE_ENVIRONMENT/*
        - facilities/$TCE_FACILITY/*
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: manual
      allow_failure: true
  before_script:
    - echo "$(uname -m)-$(uname -r)-$(uname -s)"
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@git.hpc.lanl.gov/hpcsoft/lanl-tce-facility.git
    - pushd lanl-tce-facility
    - git checkout $FACILITIES_BRANCH
    - popd
    - pushd facilities
    - ln -s ../lanl-tce-facility/lanl lanl
    - popd
    - mkdir -p builds__
    - mkdir -p buildcache
  script:
    - echo "$(uname -m)-$(uname -r)-$(uname -s)"
    - export HOME=$(pwd)
    - ./bin/process.sh
      -f $TCE_FACILITY -r $TCE_RELEASE -e $TCE_ENVIRONMENT
      -i $(pwd)/builds__ -b $(pwd)/buildcache
      --cert-store $CERT_STORE

.check_concretization:
    stage: concr_checks
    extends: .build_environment
    script:
    - ./bin/process.sh
      -f $TCE_FACILITY -r $TCE_RELEASE -e $TCE_ENVIRONMENT
      -i $(pwd)/builds__ -s -c
      --skip-buildcache-on-failure --no-buildcache-upload
    - BUILD_DIR="builds__/$(echo "$TCE_ENVIRONMENT" | head -c 9)"
    - . ${BUILD_DIR}/spack/share/spack/setup-env.sh
    # Run the concretization checker.
    - ./bin/concr_checker --all -c ${BUILD_DIR}
