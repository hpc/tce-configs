#image: toss3-pe:latest

stages:
  - syntax_and_style
  - test
  - build_first
  - build_other

yaml-lint:
  image: python:3.7
  tags:
    - untagged
  stage:
    syntax_and_style
  script:
    - python3 -m venv _env
    - source _env/bin/activate
    - pip install --upgrade pip
    - pip install yamllint
    - ./tests/lint_yaml.sh

# LANL installs in an /hpcsoft directory. Any reference to that
# in an environment is forbidden.
lanl-paths:
  stage:
    syntax_and_style
  tags:
    - untagged
  script:
    - which grep
    # Find any files that contain an hpcsoft path that isn't in a comment.
    - if grep -RE '^[^#]*/hpcsoft' releases/*; then exit 1; fi
    - if grep -RE '^[^#]*/hpcsoft' bin/*; then exit 1; fi

# No environment should have a 'config:' section. That should all
# be in facilities
config-in-env:
  stage:
    syntax_and_style
  tags:
    - untagged
  script:
    - if grep -ER ' +config:' releases/*/environments/*/spack.yaml; then exit 1; fi

bash-syntax:
  image: bash
  stage:
    syntax_and_style
  tags:
    - untagged
  script:
    - echo $http_proxy
    - ping -c 2 w2.lanl.gov
    - apk add shellcheck
    - source tests/syntax.sh

.build_environment:
  needs:
    - job: ci-test:toss-ofi-build
      artifacts: false
  artifacts:
    paths:
        - builds/*/logs/*
    expire_in: 1 week
  dependencies: [] # Don't download previous stage artifacts
  variables:
    CERT_STORE: /usr/projects/hpctools/gitlab-ci/cert_store
    TCE_FACILITY: <override me>
    TCE_ENVIRONMENT: <override me>
    TCE_RELEASE: <override me>
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - .gitlab-ci.yml
        - bin/*
        - releases/$TCE_RELEASE/environments/$TCE_ENVIRONMENT/*
        - facilities/$TCE_FACILITY/*
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: manual
      allow_failure: true
  before_script:
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@git.lanl.gov/hpcsoft/lanl-tce-facility.git
    - pushd facilities
    - ln -s ../lanl-tce-facility/lanl lanl
    - popd
  script:
    - echo "$(uname -m)-$(uname -r)-$(uname -s)"
    - env
    - export HOME=$(pwd)
    - mkdir -p builds
    - mkdir -p buildcache
    - ./bin/process.sh
      -f $TCE_FACILITY -r $TCE_RELEASE -e $TCE_ENVIRONMENT
      -i $(pwd)/builds -b $(pwd)/buildcache
      --secret $CERT_STORE/secring.gpg
      --public-key $CERT_STORE/pubring.gpg
  after_script:
    - ./bin/upload_tree.sh $CERT_STORE $(pwd)/buildcache

ci-test:toss-ofi-build:
  extends: .build_environment
  needs:
    - yaml-lint
    - bash-syntax
    - lanl-paths
    - config-in-env
  stage: test
  variables:
    TCE_FACILITY: ci-test
    TCE_RELEASE: test
    TCE_ENVIRONMENT: ci-test
  tags:
    - toss-ofi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - .gitlab-ci.yml
        - bin/*
        - releases/*/environments/*
        - releases/*/environments/*/*
        - facilities/*
        - facilities/*/*
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: manual

toss-ofi:linux-omni-none:build:
  extends: .build_environment
  stage: build_first
  variables:
    TCE_FACILITY: lanl
    TCE_RELEASE: '2022-1-0'
    TCE_ENVIRONMENT: linux-rhel7-x86_64_v3-omnipath-none
  tags:
    - toss-ofi

