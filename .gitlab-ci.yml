#image: toss3-pe:latest

stages:
  - syntax_and_style
  - test
  - concr_checks
  - build_first

# Include base definitions
include: .ci-base.yml


# Auto-generate the yaml config for the release/env tests.
create-release-checks:
    stage: setup
    script:
        - python3 ./bin/ci-steps.py
    artifacts:
        paths:
            - release-checks.yml

# Trigger the release/env checks.
trigger-sub-jobs:
    stage: triggers
    trigger:
        include:
            - artifact: release-checks.yml
              job: create-release-checks.yml

# Perform linting on all yaml files.
yaml-lint:
  image: python:3.7
  tags:
    - untagged
  stage:
    syntax_and_style
  script:
    - python3 -m venv _env
    - source _env/bin/activate
    - pip install --upgrade pip
    - pip install yamllint
    - ./tests/lint_yaml.sh

# LANL installs in an /hpcsoft directory. Any reference to that
# in an environment is forbidden.
lanl-paths:
  stage:
    syntax_and_style
  tags:
    - untagged
  script:
    - which grep
    # Find any files that contain an hpcsoft path that isn't in a comment.
    - if grep -RE '^[^#]*/hpcsoft' releases/*; then exit 1; fi
    - if grep -RE '^[^#]*/hpcsoft' bin/*; then exit 1; fi

# No environment should have a 'config:' section. That should all
# be in facilities
config-in-env:
  stage:
    syntax_and_style
  tags:
    - untagged
  script:
    - if grep -ER ' +config:' releases/*/environments/*/spack.yaml; then exit 1; fi

# Check bash syntax and style
bash-syntax:
  image: bash
  stage:
    syntax_and_style
  tags:
    - docker
  before_script:
    - apk add shellcheck
  script:
    - source tests/syntax.sh

# Perform basic functionality tests on Spack and process.sh
ci-test:toss-ofi-build:
  extends: .build_environment  # From .ci-base.yml
  needs:
    - yaml-lint
    - bash-syntax
    - lanl-paths
    - config-in-env
  stage: test
  variables:
    TCE_FACILITY: ci-test
    TCE_RELEASE: test
    TCE_ENVIRONMENT: ci-test
  tags:
    - toss-ofi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - .gitlab-ci.yml
        - bin/*
        - releases/*/environments/*
        - releases/*/environments/*/*
        - facilities/*
        - facilities/*/*
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: manual

